[package]
name = "walstream"
version = "0.1.0"
edition = "2024"
description = "A small Kafka-compatible broker backed by an object-store WAL"
license = "MIT"
repository = "https://github.com/smarzola/walstream"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
kafka-protocol = { version = "0.18", default-features = false, features = ["broker", "client", "messages_enums"] }
object_store = { version = "0.14", features = ["aws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
chrono = "0.4"
crc32c = "0.6"
rskafka = { version = "0.6", default-features = false }

[profile.release]
lto = "thin"
strip = true
